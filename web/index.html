<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo · AI 待办</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="app" id="app">
  <aside class="side glass" id="side">
    <div class="side-head">
      <h1>Todo</h1><span class="sub">AI 待办</span>
      <button class="icon-btn theme" id="theme" title="切换亮暗模式">🌙</button>
    </div>
    <nav class="views" id="views">
      <button class="view on" data-view="all"><span>全部</span><b id="n-all"></b></button>
      <button class="view" data-view="today"><span>今天</span><b id="n-today"></b></button>
      <button class="view" data-view="upcoming"><span>即将</span><b id="n-upcoming"></b></button>
      <button class="view" data-view="done"><span>已完成</span><b id="n-done"></b></button>
    </nav>
    <div class="side-section"><span class="sub">项目</span><div class="chips" id="projects"></div></div>
    <div class="side-section"><span class="sub">标签</span><div class="chips" id="tags"></div></div>
    <div class="side-foot sub" id="stats"></div>
  </aside>

  <main class="main" id="main">
    <div class="main-head">
      <button class="icon-btn ai-only" id="menu" title="视图 / 筛选">☰</button>
      <div class="grow"></div>
      <button class="btn small ai-only" id="ai-toggle"><span class="spark">✦</span> AI</button>
    </div>
    <section class="list-wrap" id="list"></section>
  </main>

  <aside class="rail glass" id="rail">
    <div class="ai-head">
      <span class="spark">✦</span><span class="ai-title">AI</span>
      <span class="sub">写下要做的事、让它改清单、或问它今天先做什么</span>
      <div class="grow"></div>
      <button class="icon-btn ai-only" id="ai-close">✕</button>
    </div>
    <div class="ai-body" id="chat"></div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="modal" id="detail" hidden>
  <div class="modal-card glass">
    <div class="modal-bar">
      <label class="check big" title="完成"><input type="checkbox" id="d-done"><span></span></label>
      <input id="d-title" class="d-title" placeholder="标题" maxlength="300" autocomplete="off">
      <button class="icon-btn" id="d-close" title="关闭">✕</button>
    </div>
    <div class="d-meta">
      <label>截止<input type="datetime-local" id="d-due"></label>
      <label>优先级<select id="d-priority"><option value="0">无</option><option value="1">低</option><option value="2">中</option><option value="3">高</option></select></label>
      <label>项目<input id="d-project" placeholder="项目" autocomplete="off" list="project-list"></label>
      <label>标签<input id="d-tags" placeholder="逗号分隔" autocomplete="off"></label>
      <datalist id="project-list"></datalist>
    </div>
    <div id="d-notes-view" class="d-notes-view md" title="点击编辑" hidden></div>
    <textarea id="d-notes" class="d-notes" placeholder="备注，支持 Markdown：链接、列表、子步骤…" spellcheck="false"></textarea>
    <div class="d-actions">
      <button class="btn primary" id="d-execute"><span class="spark">✦</span> AI 执行</button>
      <input id="d-extra" class="d-extra" placeholder="给这次执行的补充说明（可选）" autocomplete="off">
      <div class="grow"></div>
      <button class="btn small" id="d-doing">开始做</button>
      <button class="btn small danger" id="d-delete">删除</button>
    </div>
    <div class="runs" id="d-runs"></div>
    <details class="history"><summary class="sub">历史</summary><div id="d-events" class="events"></div></details>
  </div>
</div>

<script type="module" src="./app.ts"></script>
</body>
</html>
