<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo · AI 待办</title>
<link rel="icon" type="image/png" href="/icon.png">
<!-- theme before first paint (ai-space docs/app-spec.md, App pages): ?theme= → the saved choice → the system.
     data-mode names the choice (system, light, dark) for the theme button's icon. The page is Chinese only (TODO_LANG=zh). -->
<script>(function(){var d=document.documentElement;var q=new URLSearchParams(location.search);var t=q.get("theme");if(!t){try{t=localStorage.getItem("todo-theme")}catch(e){}}if(t==="light"||t==="dark")d.dataset.theme=t;d.dataset.mode=t==="light"||t==="dark"?t:"system";})();</script>
<script>/* The panel's accent (ai-space docs/ui-kit.md#accent): ?accent=<light>.<dark>, kept under space.accent; an unlayered style wins over the kit's layers. */(function(){var re=/^[0-9a-f]{6}\.[0-9a-f]{6}$/i,a=new URLSearchParams(location.search).get("accent");if(a&&re.test(a)){try{localStorage.setItem("space.accent",a)}catch(e){}}else{try{a=localStorage.getItem("space.accent")}catch(e){a=null}}if(!a||!re.test(a))return;var c=a.split("."),s=document.createElement("style");s.textContent=':root{--accent:#'+c[0]+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#'+c[1]+'}}:root[data-theme="dark"]{--accent:#'+c[1]+'}';document.head.appendChild(s)})()</script>
<!-- Space Tiles (ai-space docs/ui-kit.md): this app's copy of the kit, then the space's current /_space/ui.css, then this app's rules.
     Bun's HTML bundler moves and merges the stylesheets, so cascade layers set the order: styles.css imports the copy into layer kit
     and keeps its own rules in layer app; the space's version goes into layer space, added at runtime so the bundler leaves the path
     alone (a 404 on an older ai-space or on the app's own port is ignored). -->
<script>(function(){var s=document.createElement("style");s.textContent='@layer kit, space, app;@import url("/_space/ui.css") layer(space);';document.head.appendChild(s)})()</script>
<link rel="stylesheet" href="./styles.css">
<!-- ai-space usage heartbeat (docs/usage.md); added at runtime so Bun's HTML bundler leaves it alone -->
<script>(function(){var s=document.createElement("script");s.src="/_space/usage.js";s.defer=true;document.head.appendChild(s)})()</script>
<!-- ai-space feedback button (docs/feedback.md); shows only when the owner turned it on; a 404 on an older ai-space -->
<script>(function(){var s=document.createElement("script");s.src="/_space/feedback.js";s.defer=true;document.head.appendChild(s)})()</script>
</head>
<body>
<div class="sp-app">
  <nav class="sp-tile sp-side" id="side" aria-label="视图与筛选">
    <div class="sp-brand">
      <span class="sp-logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <div class="sp-brand-txt"><strong>Todo</strong><span class="sp-brand-sub"><span>AI 待办</span><span id="tz"></span><span id="machine"></span></span></div>
      <button type="button" class="sp-icon-btn sp-side-close" id="side-close" aria-label="关闭菜单" title="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sp-search" role="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sp-sr" for="search">搜索任务</label>
      <input id="search" type="search" placeholder="搜索" autocomplete="off">
      <span class="sp-kbd" aria-hidden="true">/</span>
    </div>
    <div class="sp-side-scroll">
      <div class="sp-ngroup" id="m-group" hidden>
        <div class="sp-nlabel" id="m-label">机器</div>
        <ul id="machines" aria-labelledby="m-label"></ul>
      </div>
      <div class="sp-ngroup">
        <div class="sp-nlabel" id="g-list">清单</div>
        <ul aria-labelledby="g-list">
          <li><button type="button" class="sp-nitem" data-view="all"><span>全部</span><span class="sp-nc" id="n-all"></span></button></li>
          <li><button type="button" class="sp-nitem" data-view="today"><span>今天</span><span class="sp-nc" id="n-today"></span></button></li>
          <li><button type="button" class="sp-nitem" data-view="upcoming"><span>即将</span><span class="sp-nc" id="n-upcoming"></span></button></li>
        </ul>
      </div>
      <div class="sp-ngroup">
        <div class="sp-nlabel" id="g-archive">归档</div>
        <ul aria-labelledby="g-archive">
          <li><button type="button" class="sp-nitem" data-view="review"><span>验收</span><span class="sp-nc" id="n-review"></span></button></li>
          <li><button type="button" class="sp-nitem" data-view="deferred"><span>暂不处理</span><span class="sp-nc" id="n-deferred"></span></button></li>
          <li><button type="button" class="sp-nitem" data-view="done"><span>已完成</span><span class="sp-nc" id="n-done"></span></button></li>
        </ul>
      </div>
      <div class="sp-ngroup">
        <div class="sp-nlabel" id="g-projects">项目</div>
        <ul id="projects" aria-labelledby="g-projects"></ul>
      </div>
      <div class="sp-ngroup">
        <div class="sp-nlabel" id="g-tags">标签</div>
        <ul id="tags" aria-labelledby="g-tags"></ul>
      </div>
    </div>
    <div class="sp-side-foot">
      <button type="button" class="sp-btn ghost sm" id="theme">
        <svg class="ic th th-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        <svg class="ic th th-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="ic th th-dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <span id="theme-label">跟随系统</span>
      </button>
    </div>
  </nav>

  <div class="sp-work has-aside">
    <main class="sp-center" id="main">
      <div class="sp-mbar">
        <button type="button" class="sp-icon-btn" id="menu" aria-label="视图 / 筛选" title="视图 / 筛选"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <strong>Todo</strong>
        <button type="button" class="sp-icon-btn" id="m-ai" aria-label="AI 助手" title="AI 助手"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/></svg></button>
      </div>

      <header class="sp-head">
        <div class="head-title">
          <h1 id="view-title">全部</h1>
          <div class="sp-head-sub"><span id="today-chip"></span></div>
        </div>
        <div class="sp-head-actions">
          <button type="button" class="sp-btn sp-only-mid" id="ai-toggle"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/></svg>AI 助手</button>
          <button type="button" class="sp-btn-ink" id="new-todo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建待办</button>
        </div>
      </header>

      <div class="sp-toolbar">
        <div class="sp-seg" id="seg" role="group" aria-label="按状态筛选">
          <button type="button" data-seg="" aria-pressed="true">全部</button>
          <button type="button" data-seg="doing" aria-pressed="false">进行中</button>
          <button type="button" data-seg="ai" aria-pressed="false" title="这个页面启动或看着的 AI 执行">AI 执行中</button>
        </div>
        <div class="filters" id="filters"></div>
      </div>

      <section class="sp-tile stats" id="kpis" aria-label="统计"></section>
      <section class="sp-tile list" id="list" aria-label="待办列表"></section>
    </main>

    <aside class="sp-tile sp-aside" id="rail" aria-labelledby="ai-title">
      <div class="sp-aside-head">
        <h2 class="sp-tt" id="ai-title"><span class="sp-sq" aria-hidden="true"></span>AI 助手</h2>
        <button type="button" class="sp-icon-btn sp-aside-close" id="ai-close" aria-label="关闭 AI 助手" title="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="ai-body" id="chat"></div>
    </aside>
  </div>
</div>

<div class="sp-scrim" id="scrim"></div>

<div class="modal" id="detail" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="sp-dialog-head modal-bar">
      <label class="sp-check big" title="完成"><input type="checkbox" id="d-done" aria-label="完成"><span><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></label>
      <input id="d-title" class="d-title" placeholder="标题" maxlength="300" autocomplete="off" aria-label="标题">
      <button type="button" class="sp-icon-btn" id="d-close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sp-dialog-body">
      <div class="d-meta">
        <div class="sp-field"><label for="d-due">截止</label><input type="datetime-local" id="d-due" class="sp-input"></div>
        <div class="sp-field"><label for="d-priority">优先级</label><select id="d-priority" class="sp-select"><option value="0">无</option><option value="1">低</option><option value="2">中</option><option value="3">高</option></select></div>
        <div class="sp-field"><label for="d-project">项目</label><input id="d-project" class="sp-input" placeholder="项目" autocomplete="off" list="project-list"></div>
        <div class="sp-field"><label for="d-tags">标签</label><input id="d-tags" class="sp-input" placeholder="逗号分隔" autocomplete="off"></div>
        <datalist id="project-list"></datalist>
      </div>
      <div class="sp-field">
        <span class="lbl" id="d-notes-label">备注</span>
        <div id="d-notes-view" class="d-notes-view md" title="点击编辑" hidden></div>
        <textarea id="d-notes" class="sp-textarea d-notes" aria-labelledby="d-notes-label" placeholder="备注，支持 Markdown：链接、列表、子步骤…" spellcheck="false"></textarea>
      </div>
      <div class="d-run">
        <button type="button" class="sp-btn-ink" id="d-execute" title="交给 AI 智能体执行（完整模式，不是对话）"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/></svg>AI 执行</button>
        <input id="d-extra" class="sp-input d-extra" placeholder="给这次执行的补充说明（可选）" autocomplete="off" aria-label="给这次执行的补充说明">
      </div>
      <div class="d-actions">
        <button type="button" class="sp-btn sm" id="d-doing">开始做</button>
        <button type="button" class="sp-btn sm" id="d-review" title="做完了，交给你验收">提交验收</button>
        <button type="button" class="sp-btn sm" id="d-accept" title="验收通过，标为完成">通过</button>
        <button type="button" class="sp-btn sm" id="d-reject" title="验收不通过，写明原因后退回进行中">退回</button>
        <button type="button" class="sp-btn sm" id="d-defer">暂不处理</button>
        <div class="grow"></div>
        <button type="button" class="sp-btn ghost sm danger-text" id="d-delete">删除</button>
      </div>
      <div class="reject-box" id="d-reject-box" hidden>
        <div class="sp-field">
          <label for="d-reject-reason">退回原因</label>
          <p class="sp-hint">写入操作记录，任务回到进行中；AI 下次执行会看到这条原因。</p>
          <textarea id="d-reject-reason" class="sp-textarea" rows="3" maxlength="4000" placeholder="哪里不满足验收，需要怎么改…"></textarea>
        </div>
        <div class="reject-bar"><div class="grow"></div><button type="button" class="sp-btn sm" id="d-reject-cancel">取消</button><button type="button" class="sp-btn-danger sm" id="d-reject-send">确认退回</button></div>
      </div>
      <section class="d-sec plan" aria-labelledby="d-plan-label">
        <div class="sec-head">
          <h3 class="sp-tt" id="d-plan-label"><span class="sp-sq" aria-hidden="true"></span>方案</h3>
          <span class="plan-meta" id="d-plan-meta"></span>
          <div class="grow"></div>
          <span class="plan-state" id="d-plan-state" aria-live="polite"></span>
          <button type="button" class="sp-btn sm" id="d-plan-edit" aria-controls="d-plan">编辑</button>
          <button type="button" class="sp-btn sm" id="d-plan-versions" aria-expanded="false">版本</button>
        </div>
        <div class="sp-banner warn plan-conflict" id="d-plan-conflict" role="alert" hidden>
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3Z"/><path d="M12 10v4M12 17v.01"/></svg>
          <span class="grow">方案已被他人更新，你的修改还没有保存。</span>
          <button type="button" class="sp-btn sm" id="d-plan-reload">载入最新</button>
          <button type="button" class="sp-btn-danger sm" id="d-plan-force">覆盖</button>
        </div>
        <div class="plan-read" id="d-plan-read">
          <div id="d-plan-view" class="plan-clamp md"></div>
          <p class="plan-empty" id="d-plan-empty" hidden>暂无方案</p>
          <button type="button" class="sp-btn ghost sm plan-more" id="d-plan-more" aria-haspopup="dialog" hidden>更多</button>
        </div>
        <textarea id="d-plan" class="sp-textarea d-notes" aria-labelledby="d-plan-label" hidden maxlength="50000" placeholder="方案：做法和设计，支持 Markdown。始终是最新版，旧版本会保留。进展和验收写到操作记录。" spellcheck="false"></textarea>
        <div class="plan-drawer" id="d-plan-drawer" hidden>
          <div class="plan-list" id="d-plan-list"></div>
          <div class="plan-show" id="d-plan-show"></div>
        </div>
      </section>
      <section class="d-sec subs" id="d-subs" aria-labelledby="d-subs-label">
        <div class="sec-head"><h3 class="sp-tt"><span class="sp-sq" aria-hidden="true"></span><span id="d-subs-label">子任务</span></h3><span class="sec-n" id="d-subs-n"></span></div>
        <div id="d-parent" class="d-parent" hidden></div>
        <div id="d-subs-list" class="subs-list"></div>
        <input id="d-sub-add" class="sp-input d-sub-add" placeholder="＋ 添加子任务，回车确认" maxlength="300" autocomplete="off" aria-label="添加子任务">
      </section>
      <section class="d-sec operation-records" aria-labelledby="d-records-label">
        <div class="sec-head"><h3 class="sp-tt" id="d-records-label"><span class="sp-sq" aria-hidden="true"></span>操作记录</h3></div>
        <p class="sp-hint">记录进展、操作和验证结果。每次追加独立保存；可编辑，旧版本会保留。</p>
        <div class="sp-field">
          <label for="d-record-content">新的操作记录</label>
          <textarea id="d-record-content" class="sp-textarea" rows="3" maxlength="20000" placeholder="补充这次操作的内容，支持 Markdown…"></textarea>
        </div>
        <label class="sp-hint" for="d-record-images">添加图片（最多 6 张，每张 10 MB，也可粘贴到输入框）</label>
        <input id="d-record-images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
        <div id="d-record-preview" class="record-images"></div>
        <button type="button" class="sp-btn sm" id="d-record-add">追加记录</button>
        <div id="d-records" aria-live="polite"></div>
        <button type="button" class="sp-btn sm" id="d-record-more" hidden>查看更早记录</button>
      </section>
      <div class="runs" id="d-runs"></div>
      <details class="d-sec history"><summary><span class="sp-tt"><span class="sp-sq" aria-hidden="true"></span>历史</span></summary><div id="d-events" class="events"></div></details>
    </div>
  </div>
</div>

<dialog class="sp-dialog plan-full" id="plan-full" aria-labelledby="pf-title">
  <div class="pf-card">
    <div class="sp-dialog-head">
      <div class="pf-heading"><h2 class="sp-tt" id="pf-title"><span class="sp-sq" aria-hidden="true"></span>方案</h2><span class="plan-meta" id="pf-meta"></span></div>
      <button type="button" class="sp-btn sm" id="pf-edit">编辑</button>
      <button type="button" class="sp-icon-btn" id="pf-close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="pf-body md" id="pf-body" tabindex="0" aria-label="完整方案"></div>
  </div>
</dialog>

<dialog class="image-view" id="image-view" aria-label="查看图片">
  <div class="iv-bar">
    <span class="iv-name" id="iv-name"></span>
    <span class="iv-count" id="iv-count"></span>
    <a class="sp-btn sm" id="iv-open" target="_blank" rel="noopener">原图</a>
    <button type="button" class="sp-icon-btn" id="iv-close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="iv-stage" id="iv-stage"><img id="iv-img" alt="" title="点击放大 / 缩小"></div>
  <button type="button" class="sp-icon-btn iv-nav iv-prev" id="iv-prev" title="上一张" aria-label="上一张"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button type="button" class="sp-icon-btn iv-nav iv-next" id="iv-next" title="下一张" aria-label="下一张"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</dialog>

<script type="module" src="./app.ts"></script>
</body>
</html>
