<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo · AI 待办</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="./styles.css">
<!-- ai-space usage heartbeat (docs/usage.md); added at runtime so Bun's HTML bundler leaves it alone -->
<script>(function(){var s=document.createElement("script");s.src="/_space/usage.js";s.defer=true;document.head.appendChild(s)})()</script>
<!-- ai-space feedback button (docs/feedback.md); shows only when the owner turned it on; a 404 on an older ai-space -->
<script>(function(){var s=document.createElement("script");s.src="/_space/feedback.js";s.defer=true;document.head.appendChild(s)})()</script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <img class="logo" src="/icon.svg" alt="" aria-hidden="true">
      <div class="brand-text"><b>Todo</b><span>AI 待办 · <span id="tz"></span></span></div>
    </div>
    <label class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="side-scroll">
      <div class="nav-label">清单</div>
      <nav class="views" id="views">
        <button class="view on" data-view="all"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>全部</span><b id="n-all"></b></button>
        <button class="view" data-view="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span>今天</span><b id="n-today"></b></button>
        <button class="view" data-view="upcoming"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>即将</span><b id="n-upcoming"></b></button>
      </nav>
      <div class="nav-label">归档</div>
      <nav class="views">
        <button class="view" data-view="review"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4.5h6M9 4.5a1.5 1.5 0 0 0-1.5 1.5v.5h9V6A1.5 1.5 0 0 0 15 4.5"/><path d="M7.5 5.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 20.5h12a1.5 1.5 0 0 0 1.5-1.5V7A1.5 1.5 0 0 0 18 5.5h-1.5"/><path d="m8.8 13.2 2.2 2.2 4.4-4.6"/></svg><span>验收</span><b id="n-review"></b></button>
        <button class="view" data-view="deferred"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 9v6M14 9v6"/></svg><span>暂不处理</span><b id="n-deferred"></b></button>
        <button class="view" data-view="done"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg><span>已完成</span><b id="n-done"></b></button>
      </nav>
      <div class="nav-label">项目</div>
      <nav class="views" id="projects"></nav>
      <div class="nav-label">标签</div>
      <nav class="views" id="tags"></nav>
    </div>
    <div class="side-foot">
      <button class="view" id="theme"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span id="theme-label">深色模式</span></button>
    </div>
  </aside>

  <div class="content">
    <header class="top">
      <button class="icon-btn narrow-only" id="menu" title="视图 / 筛选"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <svg class="ic top-ic" viewBox="0 0 24 24"><path d="M4 6.5h2M9 6.5h11M4 12h2M9 12h11M4 17.5h2M9 17.5h11"/></svg>
      <h1 id="view-title">全部</h1>
      <span class="top-sub" id="view-sub"></span>
      <div class="grow"></div>
      <button class="btn rail-only" id="ai-toggle"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/></svg> AI</button>
    </header>

    <div class="body">
      <main class="main" id="main">
        <div class="toolbar">
          <span class="date-chip"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="today-chip"></span></span>
          <div class="filters" id="filters"></div>
          <div class="grow"></div>
          <span class="toolbar-note" id="toolbar-note"></span>
        </div>
        <section class="kpis" id="kpis"></section>
        <section class="list-wrap" id="list"></section>
      </main>

      <aside class="rail" id="rail">
        <section class="card trend-card" id="trend"></section>
        <section class="card ai-card">
          <div class="card-head">
            <span class="tile ai"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/></svg></span>
            <div class="card-title"><b>AI 助手</b><span>写下要做的事、让它改清单、或问它今天先做什么</span></div>
            <div class="grow"></div>
            <button class="icon-btn rail-only" id="ai-close" title="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
          <div class="ai-body" id="chat"></div>
        </section>
      </aside>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="modal" id="detail" hidden>
  <div class="modal-card">
    <div class="modal-bar">
      <label class="check big" title="完成"><input type="checkbox" id="d-done"><span></span></label>
      <input id="d-title" class="d-title" placeholder="标题" maxlength="300" autocomplete="off">
      <button class="icon-btn" id="d-close" title="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="d-meta">
      <label>截止<input type="datetime-local" id="d-due"></label>
      <label>优先级<select id="d-priority"><option value="0">无</option><option value="1">低</option><option value="2">中</option><option value="3">高</option></select></label>
      <label>项目<input id="d-project" placeholder="项目" autocomplete="off" list="project-list"></label>
      <label>标签<input id="d-tags" placeholder="逗号分隔" autocomplete="off"></label>
      <datalist id="project-list"></datalist>
    </div>
    <div id="d-notes-view" class="d-notes-view md" title="点击编辑" hidden></div>
    <textarea id="d-notes" class="d-notes" placeholder="备注，支持 Markdown：链接、列表、子步骤…" spellcheck="false"></textarea>
    <div class="d-actions">
      <button class="btn primary" id="d-execute" title="交给 AI 智能体执行（完整模式，不是对话）"><span class="spark">✦</span> AI 执行</button>
      <input id="d-extra" class="d-extra" placeholder="给这次执行的补充说明（可选）" autocomplete="off">
      <div class="grow"></div>
      <button class="btn small" id="d-doing">开始做</button>
      <button class="btn small" id="d-review" title="做完了，交给你验收">提交验收</button>
      <button class="btn small ok" id="d-accept" title="验收通过，标为完成">通过</button>
      <button class="btn small" id="d-reject" title="验收不通过，写明原因后退回进行中">退回</button>
      <button class="btn small" id="d-defer">暂不处理</button>
      <button class="btn small danger" id="d-delete">删除</button>
    </div>
    <div class="reject-box" id="d-reject-box" hidden>
      <label class="sub" for="d-reject-reason">退回原因</label>
      <p class="record-hint">写入操作记录，任务回到进行中；AI 下次执行会看到这条原因。</p>
      <textarea id="d-reject-reason" class="d-notes" rows="3" maxlength="4000" placeholder="哪里不满足验收，需要怎么改…"></textarea>
      <div class="reject-bar"><div class="grow"></div><button class="btn small" id="d-reject-cancel">取消</button><button class="btn small danger" id="d-reject-send">确认退回</button></div>
    </div>
    <section class="plan" aria-labelledby="d-plan-label">
      <div class="plan-head">
        <h3 class="sub" id="d-plan-label">方案</h3>
        <span class="plan-meta" id="d-plan-meta"></span>
        <div class="grow"></div>
        <span class="plan-state" id="d-plan-state" aria-live="polite"></span>
        <button class="btn small" id="d-plan-edit" aria-controls="d-plan">编辑</button>
        <button class="btn small" id="d-plan-versions" aria-expanded="false">版本</button>
      </div>
      <div class="plan-conflict" id="d-plan-conflict" role="alert" hidden>
        <span>方案已被他人更新，你的修改还没有保存。</span>
        <button class="btn small" id="d-plan-reload">载入最新</button>
        <button class="btn small danger" id="d-plan-force">覆盖</button>
      </div>
      <div class="plan-read" id="d-plan-read">
        <div id="d-plan-view" class="plan-clamp md"></div>
        <p class="plan-empty" id="d-plan-empty" hidden>暂无方案</p>
        <button class="plan-more" id="d-plan-more" aria-haspopup="dialog" hidden>更多</button>
      </div>
      <textarea id="d-plan" class="d-notes" aria-labelledby="d-plan-label" hidden maxlength="50000" placeholder="方案：做法和设计，支持 Markdown。始终是最新版，旧版本会保留。进展和验收写到操作记录。" spellcheck="false"></textarea>
      <div class="plan-drawer" id="d-plan-drawer" hidden>
        <div class="plan-list" id="d-plan-list"></div>
        <div class="plan-show" id="d-plan-show"></div>
      </div>
    </section>
    <div class="subs" id="d-subs">
      <div class="subs-head"><span class="sub" id="d-subs-label">子任务</span><b id="d-subs-n"></b><div class="grow"></div></div>
      <div id="d-parent" class="d-parent" hidden></div>
      <div id="d-subs-list" class="subs-list"></div>
      <input id="d-sub-add" class="d-sub-add" placeholder="＋ 添加子任务，回车确认" maxlength="300" autocomplete="off">
    </div>
    <section class="operation-records" aria-labelledby="d-records-label">
      <h3 class="sub" id="d-records-label">操作记录</h3>
      <p class="record-hint">记录进展、操作和验证结果。每次追加独立保存；可编辑，旧版本会保留。</p>
      <label class="sub" for="d-record-content">新的操作记录</label>
      <textarea id="d-record-content" class="d-notes" rows="3" maxlength="20000" placeholder="补充这次操作的内容，支持 Markdown…"></textarea>
      <label class="record-hint" for="d-record-images">添加图片（最多 6 张，每张 10 MB，也可粘贴到输入框）</label>
      <input id="d-record-images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
      <div id="d-record-preview" class="record-images"></div>
      <button class="btn small" id="d-record-add">追加记录</button>
      <div id="d-records" aria-live="polite"></div>
      <button class="btn small" id="d-record-more" hidden>查看更早记录</button>
    </section>
    <div class="runs" id="d-runs"></div>
    <details class="history"><summary class="sub">历史</summary><div id="d-events" class="events"></div></details>
  </div>
</div>

<dialog class="plan-full" id="plan-full" aria-labelledby="pf-title">
  <div class="pf-card">
    <div class="pf-bar">
      <div class="pf-heading"><h2 id="pf-title">方案</h2><span class="plan-meta" id="pf-meta"></span></div>
      <button class="btn small" id="pf-edit">编辑</button>
      <button class="icon-btn" id="pf-close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="pf-body md" id="pf-body" tabindex="0" aria-label="完整方案"></div>
  </div>
</dialog>

<script type="module" src="./app.ts"></script>
</body>
</html>
